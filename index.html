
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Bible App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📖 Holy Bible</h1>
        <p>Read God's Word Every Day</p>
    </header>

    <main>
        <section class="daily-verse">
            <h2>Verse of the Day</h2>
            <p id="verse">
                "The Lord is my shepherd;
                I shall not want."
            </p>
            <strong>Psalm 23:1</strong>
        </section>

        <section class="bible-reader">
            <h2>Start Reading</h2>
            <p>Explore the Word of God.</p>
            <button onclick="readBible()">Read Bible</button>
        </section>
    </main>

    <footer>
        <p>© 2026 Holy Bible App</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
